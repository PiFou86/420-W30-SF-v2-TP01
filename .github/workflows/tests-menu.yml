name: Tests — Menu

"on":
  push:
    branches: [main, dev]
    paths:
      - 'lots/Menu/**'
      - '.github/workflows/tests-menu.yml'
      - '.github/scripts/**'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
  pull_request:
    branches: [main, dev]
    paths:
      - 'lots/Menu/**'
      - '.github/workflows/tests-menu.yml'
      - '.github/scripts/**'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  valider:
    name: Menu — tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lots/Menu
    steps:
      - name: Récupérer uniquement le lot et le vérificateur
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            lots/Menu
            .github/scripts
      - name: Installer .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restaurer les dépendances des tests
        run: dotnet restore TP01_Menu.Tests/TP01_Menu.Tests.csproj
      - name: Construire les projets nécessaires et exécuter les tests
        id: tests
        run: dotnet test TP01_Menu.Tests/TP01_Menu.Tests.csproj --configuration Release --no-restore --logger 'trx;LogFileName=resultats.trx' --results-directory TestResults
      - name: Vérifier que des tests ont réellement réussi
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: python3 ../../.github/scripts/verifier_resultats_tests.py TestResults
